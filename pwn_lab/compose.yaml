services:
  pwnlab:
    build:
      context: .

    container_name: pwnlab

    stdin_open: true
    tty: true

    init: true

    working_dir: /workspace

    volumes:
      - ${HOME}/pwn:/workspace

    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp=unconfined

    environment:
      TERM: xterm-256color
      COLORTERM: truecolor

    restart: "no"
