services:
  pwnlab:
    build:
      context: .
      dockerfile: Dockerfile
    image: pwnlab:local

    container_name: pwnlab

    hostname: pwnlab

    stdin_open: true
    tty: true

    # Persistent workspace
    volumes:
      - ./workspace:/workspace

    # Internet/network access
    network_mode: bridge

    # Needed for debugging processes with GDB/Pwndbg
    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp=unconfined

    environment:
      TERM: xterm-256color
      COLORTERM: truecolor

    working_dir: /workspace